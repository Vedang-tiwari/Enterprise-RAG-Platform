version: '3.8'

services:
  # Master FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: enterprise_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_pass@postgres:5432/enterprise_rag
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=enterprise-documents
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  # Asynchronous Ingestion Celery Worker
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: enterprise_rag_worker
    restart: unless-stopped
    command: celery -A backend.app.workers.celery_app worker --loglevel=info -c 4
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_pass@postgres:5432/enterprise_rag
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - backend
      - rabbitmq
      - redis

  # PostgreSQL Relational Truth
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_rag_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=enterprise_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: enterprise_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: enterprise_rag_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: enterprise_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: enterprise_rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
